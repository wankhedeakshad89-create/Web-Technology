<!DOCTYPE html>
<html>
<head>
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
      <h2>My To-Do List</h2>
        
      <div class="input-box">
         <input type="text" id="taskInput" placeholder="Add a new task...">
         <button id="addBtn" onclick="addTask()">Add Task</button>
      </div>

       <!-- list where tasks will be added -->
       <ul id="taskList">
           <li>
               <span>exercise</span>
               <button class="del-btn" onclick="deleteTask(this)">Delete</button>
           </li>
           <li>
               <span>study</span>
               <button class="del-btn" onclick="deleteTask(this)">Delete</button>
           </li>
       </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
